<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inner Planets - Planet Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light">
    <nav class="navbar-dark bg-black">
        <div class="container">
            <a class="navbar-brand fw-bold" href="home.html">🚀 Planet Explorer</a>
        </div>
    </nav>

    <main class="container py-5">
        <h1 class="fw-bold">☀️ Inner Planets</h1>
        <p class="text-muted">Discover the two planets closest to our sun.</p>

        <div class="row g-4 mt-3">
            <div class="col-md-6">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <span class="badge bg-secondary">Planet 1</span>
                        <h2 class="mt-2">Mercury</h2>
                        <p>Mercury is the closest planet to our sun.</p>
                        <button class="btn btn-outline-dark">Explore Mercury</button>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <span class="badge bg-warning text-dark">Planet 2</span>
                        <h2 class="mt-2">Venus</h2>
                        <p>Venus is the hottest planet in our solar system.</p>
                        <button class="btn btn-outline-warning">Explore Venus</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between mt-5">
            <a href="home.html" class="btn btn-secondary">Home</a>
            <a href="page2.html" class="btn btn-primary">Next -></a>
        </div>
    </main>
</body>

</html>
