<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outer Planets - Planet Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

<body class="bg-light">
    <nav class="navbar-dark bg-black">

    </nav>

    <main class="container py-5">
        <h1 class="fw-bold">🔵 Outer Planets</h1>

        <div class="row g-4 mt-3">
            <div class="col-md-6">

                        <span class="badge bg-info text-dark">Ice Giant</span>

                        <button class="btn btn-info">Explore Uranus</button>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card h-100 shadow">
                    <div class="card-body">
                        <span class="badge bg-primary">Farthest Planet</span>
                        <h2 class="mt-2">Neptune</h2>
                        <p>Neptune is a distant blue planet with extremely strong winds.</p>
                        <button class="btn btn-primary">Explore Neptune</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between mt-5">
